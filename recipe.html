<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>

    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/recipe-detail.css">
    <script src="JS/theme.js"></script>
</head>
<body>

<header class="site-header">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change color theme" aria-pressed="false"></button>
    <a class="brand" href="index.html">← Back to recipes</a>
</header>

<main>
    <p id="detail-status" role="status">Loading recipe...</p>

    <section id="recipe-detail" hidden>
        <div class="details-panel">
            <h1 id="recipe-name"></h1>

            <div class="detail-layout">
                <img id="recipe-image" src="" alt="">

                <div>
                    <p><strong>Cuisine:</strong> <span id="recipe-cuisine"></span></p>
                    <p><strong>Prep time:</strong> <span id="recipe-prep"></span> min</p>
                    <p><strong>Cook time:</strong> <span id="recipe-cook"></span> min</p>
                    <p><strong>Servings:</strong> <span id="recipe-servings"></span></p>
                    <p><strong>Difficulty:</strong> <span id="recipe-difficulty"></span></p>

                    <h2>Ingredients</h2>
                    <ul id="ingredients-list"></ul>

                    <h2>Instructions</h2>
                    <ol id="instructions-list"></ol>
                </div>
            </div>
        </div>
    </section>
</main>

<script type="module" src="JS/recipe-detail.js"></script>
</body>
</html>
