<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opskrifter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Opskrifter</h1>

<div id="recipeContainer"></div>

<div id="recipeDetails" class="hidden">
  <button id="backButton">← Tilbage</button>

  <h2 id="recipeName"></h2>

  <img id="recipeImage" alt="Opskrift">

  <div class="info">
    <p><strong>Portioner:</strong> <span id="servings"></span></p>
    <p><strong>Forberedelse:</strong> <span id="prepTime"></span> min</p>
    <p><strong>Tilberedning:</strong> <span id="cookTime"></span> min</p>
    <p><strong>Sværhedsgrad:</strong> <span id="difficulty"></span></p>
  </div>

  <h3>Ingredienser</h3>
  <ul id="ingredients"></ul>

  <h3>Instruktioner</h3>
  <ol id="instructions"></ol>
</div>

<script src="script.js"></script>

</body>
</html>
